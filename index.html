<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Themengebiete">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<!-- iOS/iPadOS "Zum Home-Bildschirm" liest das Icon von hier, nicht aus dem
     Manifest — ohne dieses Tag bleibt es beim Buchstaben-Platzhalter. -->
<link rel="apple-touch-icon" href="icon-180.png">
<title>Themengebiete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">

</head>
<body>
<style id="app-style">
:root{
  --bg:#F6F7F4; --surface:#FFFFFF; --surface-2:#EFF1EC;
  --ink:#161B18; --ink-2:#3A443E; --muted:#66736B;
  --line:#DCE2DB; --line-2:#C7D0C6;
  --accent:#1E6B4F; --accent-ink:#0E4433; --accent-soft:#E3EFE8; --accent-line:#B7D5C6;
  --on-accent:#FFFFFF;
  --danger:#9A3B2C; --danger-soft:#F6E6E2;
  --shadow:0 1px 2px rgba(22,27,24,.05), 0 8px 24px -16px rgba(22,27,24,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1412; --surface:#161D19; --surface-2:#1D2621;
    --ink:#E8EDE9; --ink-2:#C3CEC7; --muted:#8E9C94;
    --line:#26302B; --line-2:#354039;
    --accent:#5FC79A; --accent-ink:#A8E3C7; --accent-soft:#1A2C24; --accent-line:#2C4A3B;
    --on-accent:#0F1412;
    --danger:#E08C7B; --danger-soft:#31201C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#161D19; --surface-2:#1D2621;
  --ink:#E8EDE9; --ink-2:#C3CEC7; --muted:#8E9C94;
  --line:#26302B; --line-2:#354039;
  --accent:#5FC79A; --accent-ink:#A8E3C7; --accent-soft:#1A2C24; --accent-line:#2C4A3B;
  --on-accent:#0F1412;
  --danger:#E08C7B; --danger-soft:#31201C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button, input, textarea, select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

/* ---------- shell ---------- */
html{height:100%}
body{height:100%; overflow:hidden}
.app{height:100%; display:flex; flex-direction:column; overflow:hidden}

.topbar{
  flex:none; display:flex; align-items:center; justify-content:flex-end; gap:14px;
  /* oben Platz für die Statusleiste des Systems (Uhrzeit, Akku), sonst liegt
     sie im App-Modus über den Knöpfen */
  padding:calc(10px + env(safe-area-inset-top, 0px))
          calc(18px + env(safe-area-inset-right, 0px))
          10px
          calc(18px + env(safe-area-inset-left, 0px));
  background:var(--surface);
  border-bottom:1px solid var(--line); z-index:20;
}
#undo-btn{font-size:16px; line-height:1; padding:5px 10px}
#nav-btn{display:none; font-size:17px; line-height:1; padding:4px 10px; margin-right:auto}
.nav-scrim{display:none}
#accent-btn{padding:6px 10px; display:flex; align-items:center}
.swatch{
  display:block; width:13px; height:13px; border-radius:50%;
  background:var(--accent); box-shadow:0 0 0 1px var(--line-2);
}
.choice .dot{
  display:inline-block; width:11px; height:11px; border-radius:50%;
  margin-right:9px; vertical-align:-1px; box-shadow:0 0 0 1px var(--line-2);
}
.status{
  font-size:12px; color:var(--muted); white-space:nowrap;
  display:flex; align-items:center; gap:6px;
}
.status .dot{width:6px; height:6px; border-radius:50%; background:var(--line-2)}
.status.dirty .dot{background:var(--accent)}
.status.dirty{color:var(--accent)}

.btn{
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
  padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:500;
  transition:background .12s ease, border-color .12s ease;
}
.btn:hover{background:var(--surface-2); border-color:var(--muted)}
.btn:disabled{opacity:.4; cursor:default}
.btn:disabled:hover{background:var(--surface); border-color:var(--line-2)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08); background:var(--accent)}
.btn.ghost{border-color:transparent; background:transparent; color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn.danger:hover{background:var(--danger-soft); border-color:var(--danger); color:var(--danger)}
.btn.sm{padding:3px 8px; font-size:12px}

.body{position:relative; flex:1 1 auto; display:flex; align-items:stretch; min-height:0; overflow:hidden}

/* ---------- rail ---------- */
.rail{
  width:288px; flex:none; background:var(--surface);
  border-right:1px solid var(--line);
  padding:16px 12px 32px; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  display:flex; flex-direction:column; gap:22px;
}
.group{display:flex; flex-direction:column; gap:2px}
.group-head{
  position:relative; display:flex; align-items:center; gap:4px;
  padding:0 6px 6px; border-bottom:1px solid var(--line); margin-bottom:6px;
}
.group-toggle{
  flex:1; min-width:0; display:flex; align-items:center; gap:7px;
  border:none; background:transparent; cursor:pointer; padding:2px 0;
  font-size:10.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); text-align:left; border-radius:5px;
}
.group-toggle:hover{color:var(--ink)}
.group-toggle .chev{
  flex:none; width:9px; font-size:9px; line-height:1;
  transition:transform .12s ease; transform-origin:50% 50%;
}
.group.collapsed .group-toggle .chev{transform:rotate(-90deg)}
/* Die Themen bleiben im Dokument und werden nur zusammengefahren — so kann es
   weich laufen, statt die Leiste bei jedem Klick neu aufzubauen. */
.group-list{overflow:hidden; transition:height .18s ease}
.group .group-toggle .cnt{display:none}
.group.collapsed .group-toggle .cnt{display:inline}
@media (prefers-reduced-motion: reduce){
  .group-list{transition:none}
  .group-toggle .chev{transition:none}
}

.group-toggle .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.group-toggle .cnt{flex:none; font-weight:400; letter-spacing:.08em; color:var(--line-2)}
.group-toggle[data-here="true"]{color:var(--accent)}
.group-toggle[data-here="true"] .cnt{color:var(--accent-line)}
/* the tools overlay the row instead of taking width from the name */
.group-head .tools{
  position:absolute; right:4px; bottom:6px; display:flex; gap:1px;
  background:var(--surface); box-shadow:-8px 0 8px -4px var(--surface);
  opacity:0; pointer-events:none; transition:opacity .12s ease;
}
.group:hover .group-head .tools,
.group:focus-within .group-head .tools{opacity:1; pointer-events:auto}
@media (hover:none){ .group-head .tools{opacity:1} }
.icon{
  border:none; background:transparent; color:var(--muted); cursor:pointer;
  width:22px; height:22px; border-radius:5px; display:grid; place-items:center;
  font-size:13px; line-height:1; padding:0;
}
.icon:hover{background:var(--surface-2); color:var(--ink)}
.icon.del:hover{background:var(--danger-soft); color:var(--danger)}
.icon:disabled{opacity:.25; cursor:default}
.icon:disabled:hover{background:transparent; color:var(--muted)}

.topic{
  display:flex; align-items:baseline; gap:9px; width:100%; text-align:left;
  padding:6px 8px; border:none; border-radius:6px; background:transparent;
  cursor:pointer; color:var(--ink-2);
}
.topic:hover{background:var(--surface-2)}
.topic[draggable="true"]{cursor:grab}
.topic[draggable="true"]:active{cursor:grabbing}
.topic.dragging{opacity:.35}
.topic.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.topic.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.group-list.drop-end{box-shadow:inset 0 -2px 0 var(--accent)}
.topic[aria-current="true"]{background:var(--accent-soft); color:var(--accent-ink)}
.topic .num{
  font-variant-numeric:tabular-nums; font-size:11.5px; font-weight:600;
  color:var(--muted); min-width:16px; text-align:right; flex:none;
}
.topic[aria-current="true"] .num{color:var(--accent)}
.topic .label{flex:1; min-width:0; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.topic[aria-current="true"] .label{font-weight:500}
.topic .empty-dot{
  flex:none; width:5px; height:5px; border-radius:50%;
  border:1px solid var(--line-2); background:transparent;
}
.rail-actions{display:flex; flex-direction:column; gap:6px; margin-top:auto; padding-top:18px}

/* ---------- main ---------- */
.main{
  flex:1 1 auto; min-width:0; min-height:0; overflow-y:auto;
  overscroll-behavior:contain;
  padding:34px calc(40px + env(safe-area-inset-right, 0px))
          calc(120px + env(safe-area-inset-bottom, 0px))
          calc(40px + env(safe-area-inset-left, 0px));
}
.sheet{max-width:70ch; margin:0 auto}

.crumb{
  font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); margin-bottom:14px;
}
.title-row{display:flex; align-items:flex-start; gap:16px; margin-bottom:6px}
.title-num{
  font-family:"Fraunces", Georgia, serif; font-weight:600;
  font-size:34px; line-height:1.05; color:var(--accent);
  font-variant-numeric:tabular-nums; flex:none; padding-top:2px;
}
h2.title{
  font-family:"Fraunces", Georgia, serif; font-weight:600;
  font-size:34px; line-height:1.12; letter-spacing:-.015em;
  margin:0; text-wrap:balance; flex:1; min-width:0;
}
.toolbar{
  display:flex; flex-wrap:wrap; align-items:center; gap:6px;
  padding:14px 0 20px; border-bottom:1px solid var(--line); margin-bottom:28px;
}
.toolbar .spacer{flex:1}
.toolbar select{
  border:1px solid var(--line-2); background:var(--surface); border-radius:6px;
  padding:5px 8px; font-size:12.5px; color:var(--ink-2); max-width:180px;
}

/* rendered content */
.doc{font-family:"Source Serif 4", Georgia, serif; font-size:17px; line-height:1.62; color:var(--ink-2)}
.doc h3{
  font-family:"IBM Plex Sans", sans-serif; font-size:12px; font-weight:600;
  letter-spacing:.13em; text-transform:uppercase; color:var(--accent);
  margin:38px 0 12px; padding-bottom:6px; border-bottom:1px solid var(--accent-line);
}
.doc h4{
  font-family:"Fraunces", Georgia, serif; font-size:19px; font-weight:600;
  color:var(--ink); margin:28px 0 8px; letter-spacing:-.01em;
}
.doc h5{
  font-family:"IBM Plex Sans", sans-serif; font-size:14px; font-weight:600;
  color:var(--ink); margin:22px 0 6px;
}
.doc > *:first-child{margin-top:0}
/* Kein zusätzlicher Abstand zwischen Absätzen und Aufzählungen — der Text
   läuft durch wie innerhalb eines Absatzes. Überschriften behalten ihren
   Abstand, damit die Gliederung erkennbar bleibt. */
.doc p{margin:0}
.doc ul, .doc ol{margin:0; padding-left:22px; display:flex; flex-direction:column; gap:0}
.doc li{padding-left:2px}
.doc li > ul, .doc li > ol{margin:0}
/* Einrücken per Tab: reine Verschiebung nach rechts, keine Zitat-Optik */
.doc blockquote{margin:0 0 0 22px; padding:0; border:0}
.doc strong{color:var(--ink); font-weight:600}
.doc code{
  font-family:"IBM Plex Sans", monospace; font-size:.88em;
  background:var(--surface-2); padding:1px 5px; border-radius:4px;
}
.doc hr{border:none; border-top:1px solid var(--line); margin:28px 0}
.table-wrap{overflow-x:auto; margin:0 0 18px}
.doc table{border-collapse:collapse; font-size:15px; width:auto; max-width:100%}
.doc th, .doc td{
  border-bottom:1px solid var(--line); padding:7px 30px 7px 0; text-align:left;
  vertical-align:top; font-variant-numeric:tabular-nums;
}
.doc th:last-child, .doc td:last-child{padding-right:0}
.doc th{
  font-family:"IBM Plex Sans", sans-serif; font-size:11px; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
  border-bottom-color:var(--line-2);
}

.blank{
  border:1px dashed var(--line-2); border-radius:10px; padding:34px 26px;
  text-align:center; color:var(--muted); font-size:14px;
}
.blank p{margin:0 0 14px}

/* editor */
.sheet.wide{max-width:none}
.editor{display:flex; flex-direction:column; gap:12px}

.fmtbar{
  display:flex; flex-wrap:wrap; align-items:center; gap:2px;
  padding:6px 8px; background:var(--surface);
  border:1px solid var(--line-2); border-bottom:none; border-radius:10px 10px 0 0;
  position:sticky; top:0; z-index:6;
}
.fmt{
  border:none; background:transparent; color:var(--ink-2); cursor:pointer;
  height:29px; min-width:31px; padding:0 8px; border-radius:6px;
  font-size:13px; line-height:1; display:inline-flex; align-items:center; justify-content:center;
}
.fmt:hover{background:var(--accent-soft); color:var(--accent-ink)}
.fmt .b{font-weight:700}
.fmt .i{font-family:"Source Serif 4", Georgia, serif; font-style:italic; font-size:15px}
.fmt .h{font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:15px}
.fmt .h.sm{font-size:12px}
.fmt-sep{width:1px; height:17px; background:var(--line); margin:0 5px; flex:none}
.fmt-spacer{flex:1}
.fmt.toggle[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent-ink)}

.editable{
  min-height:120px; background:var(--surface);
  border:1px solid var(--line-2); border-top:none; border-radius:0 0 10px 10px;
  padding:26px 30px;
}
.editable:focus{outline:2px solid var(--accent); outline-offset:-2px}
.editable table{background:transparent}
.editable th, .editable td{min-width:70px}
.editable table, .editable th, .editable td{border-color:var(--line-2)}
.editable td, .editable th,
.editable td:last-child, .editable th:last-child{border:1px solid var(--line); padding:7px 12px}
.editable .table-wrap, .editable table{margin-bottom:18px}
.editable:empty::before{content:"Schreib hier los …"; color:var(--muted)}
.editor{position:relative}
.row-add{
  position:absolute; z-index:4; display:none; align-items:center; gap:6px;
  border:1px solid var(--accent-line); background:var(--accent-soft);
  color:var(--accent-ink); border-radius:999px; padding:3px 11px;
  font-size:12px; font-weight:500; cursor:pointer; white-space:nowrap;
  box-shadow:0 0 0 3px var(--surface);
}
.row-add:hover{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.row-add[data-on="true"]{display:flex}

/* modal */
.scrim{
  position:fixed; inset:0; background:rgba(16,20,18,.42); backdrop-filter:blur(2px);
  display:grid; place-items:center; padding:20px; z-index:60;
}
.modal{
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--shadow); padding:22px; width:min(420px, 100%);
  display:flex; flex-direction:column; gap:14px;
}
.modal h3{
  font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:18px; margin:0;
}
.modal p{margin:0; font-size:13.5px; color:var(--muted); line-height:1.55}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600}
.field input{
  border:1px solid var(--line-2); background:var(--bg); border-radius:7px; padding:9px 11px; font-size:15px;
}
.field input:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}
.field input[aria-invalid="true"]{border-color:var(--danger); background:var(--danger-soft)}
.modal-warn{margin:0; font-size:13px; color:var(--danger); font-weight:500}
.modal-warn[hidden]{display:none}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:2px}
.row2{display:flex; gap:10px}
.row2 .field:first-child{width:88px; flex:none}
.row2 .field:last-child{flex:1}

.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px;
  font-size:13px; box-shadow:var(--shadow); z-index:80;
}

/* ---------- landing ---------- */
.rail-home{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:7px 8px; border:none; border-radius:6px; background:transparent;
  cursor:pointer; color:var(--ink-2); font-size:14px; font-weight:500;
}
.rail-home:hover{background:var(--surface-2)}
.rail-home[aria-current="true"]{background:var(--accent-soft); color:var(--accent-ink)}
.rail-home .glyph{font-size:11px; color:var(--muted); width:16px; text-align:right}
.rail-home[aria-current="true"] .glyph{color:var(--accent)}

.sheet.home{max-width:74ch}
.home-eyebrow{
  font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); margin-bottom:14px;
}
.home h2{
  font-family:"Fraunces", Georgia, serif; font-weight:600;
  font-size:40px; line-height:1.08; letter-spacing:-.02em;
  margin:0 0 14px; text-wrap:balance;
}
.home-lead{
  font-family:"Source Serif 4", Georgia, serif; font-size:18px; line-height:1.6;
  color:var(--ink-2); max-width:54ch; margin:0 0 26px;
}
.home-group{margin-bottom:42px}
.home-group h3{
  font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent);
  margin:0 0 16px; padding-bottom:8px; border-bottom:1px solid var(--accent-line);
  display:flex; justify-content:space-between; gap:12px; align-items:baseline;
}
.home-group h3 em{font-style:normal; color:var(--muted); letter-spacing:.1em; flex:none}
.grp-rename{
  border:none; background:transparent; padding:0; margin:0; cursor:pointer;
  font:inherit; color:inherit; letter-spacing:inherit; text-transform:inherit;
  text-align:left; min-width:0; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; border-bottom:1px solid transparent;
}
.grp-rename:hover{border-bottom-color:var(--accent)}
.cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:12px}
.card{
  display:flex; flex-direction:column; gap:9px; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:15px 16px 17px; cursor:pointer; color:var(--ink); font:inherit;
  transition:border-color .12s ease, transform .12s ease;
}
.card:hover{border-color:var(--accent); transform:translateY(-1px)}
.card .n{
  font-family:"Fraunces", Georgia, serif; font-size:19px; font-weight:600;
  color:var(--accent); line-height:1; font-variant-numeric:tabular-nums;
}
.card .t{font-size:15px; font-weight:500; line-height:1.3}
.card .x{
  font-family:"Source Serif 4", Georgia, serif; font-size:13.5px; line-height:1.5;
  color:var(--muted); display:-webkit-box; -webkit-line-clamp:3;
  -webkit-box-orient:vertical; overflow:hidden;
}
.card.empty{border-style:dashed; background:transparent}
.card.empty .n{color:var(--muted)}
.card .chip{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.home-bar{display:flex; justify-content:flex-end; gap:6px; margin-bottom:12px; min-height:30px}
.home-field{border-radius:6px; outline:none}
.home-field[contenteditable="true"]{
  background:var(--surface); box-shadow:inset 0 0 0 1px var(--line-2);
  padding:3px 9px; margin-left:-9px;
}
.home-field[contenteditable="true"]:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.home-field[contenteditable="true"]:empty::before{
  content:attr(data-ph); color:var(--muted); font-weight:400;
}
p.home-eyebrow.home-field[contenteditable="true"]{display:inline-block}
.home-lead-doc{
  font-family:"Source Serif 4", Georgia, serif; font-size:18px; line-height:1.6;
  color:var(--ink-2); max-width:56ch; margin:0 0 26px;
}
.home-lead-doc p{margin:0 0 12px}
.home-lead-doc > *:last-child{margin-bottom:0}
.home-lead-doc h3{margin-top:22px}
.home-intro-blank{
  border:1px dashed var(--line-2); border-radius:10px; padding:20px 22px;
  color:var(--muted); font-size:14px; margin-bottom:26px;
}

/* ---------- table of contents ---------- */
.toc{
  border:1px solid var(--line); border-radius:10px; background:var(--surface);
  padding:14px 18px 15px; margin-bottom:34px;
}
.toc-head{
  display:flex; justify-content:space-between; align-items:baseline; gap:14px;
  font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--muted); margin-bottom:10px;
}
.toc-head > span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.toc[hidden]{display:none}
/* Aufleuchten der angesprungenen Überschrift — nur um die Wörter herum,
   deshalb schrumpft der Kasten währenddessen auf die Textbreite. */
@keyframes toc-flash{
  0%{background:var(--accent-soft); box-shadow:0 0 0 4px var(--accent-soft)}
  78%{background:var(--accent-soft); box-shadow:0 0 0 4px var(--accent-soft)}
  100%{background:transparent; box-shadow:0 0 0 4px transparent}
}
.toc-flash{
  border-radius:4px; width:max-content; max-width:100%;
  animation:toc-flash 2.2s ease-out;
}
@media (prefers-reduced-motion: reduce){
  .toc-flash{animation:none; background:var(--accent-soft); box-shadow:0 0 0 4px var(--accent-soft)}
}
.editor .toc{margin-bottom:14px}
.toc-head b{font-weight:600; color:var(--ink-2)}
.toc ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px}
.toc ol button{
  display:block; width:100%; text-align:left; border:none; background:transparent;
  padding:4px 7px; margin-left:-7px; border-radius:5px; cursor:pointer;
  color:var(--ink-2); font-size:14px; line-height:1.4;
}
.toc ol button:hover{background:var(--accent-soft); color:var(--accent-ink)}
.toc li.sub button{padding-left:24px; font-size:13.5px; color:var(--muted)}
.toc li.grp > .row{display:flex; align-items:center; gap:2px}
.toc .jump[draggable="true"]{cursor:grab}
.toc .jump[draggable="true"]:active{cursor:grabbing}
.toc .jump.dragging{opacity:.4}
.toc .jump.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.toc .jump.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.toc .ord{
  flex:none; display:flex; gap:1px; margin-left:4px;
}
.toc .ord button{
  width:28px; height:28px; padding:0; margin:0; border:none; border-radius:5px;
  background:transparent; color:var(--muted); cursor:pointer;
  font-size:12px; line-height:1; display:flex; align-items:center; justify-content:center;
}
.toc .grip{
  touch-action:none; cursor:grab; font-size:13px; letter-spacing:-1px;
  color:var(--line-2);
}
.toc .grip:active{cursor:grabbing}
.toc .jump[aria-selected="true"]{
  background:var(--accent-soft); color:var(--accent-ink); font-weight:500;
}
.toc .jump.dragging{opacity:.4}
.toc .ord button:hover{background:var(--surface-2); color:var(--ink)}
.toc .ord button:disabled{opacity:.25; cursor:default}
.toc .ord button:disabled:hover{background:transparent; color:var(--muted)}
.toc li.sub > .row{display:flex; align-items:center; gap:2px}
.toc li.sub > .row > .jump{flex:1; min-width:0}
.toc li.grp > .row > button.jump{flex:1; min-width:0; margin-left:0}
.toc .sub-toggle{
  flex:none; width:20px; height:22px; padding:0; margin:0; border:none;
  background:transparent; cursor:pointer; color:var(--muted);
  font-size:8px; line-height:1; border-radius:4px;
  display:flex; align-items:center; justify-content:center;
  transition:transform .12s ease, background .12s ease;
}
.toc .sub-toggle:hover{background:var(--surface-2); color:var(--ink)}
.toc .sub-toggle.empty{visibility:hidden; pointer-events:none}
.toc li.closed > .row > .sub-toggle{transform:rotate(-90deg)}
.toc-subs{overflow:hidden; transition:height .18s ease}
@media (prefers-reduced-motion: reduce){
  .toc-subs{transition:none}
  .toc .sub-toggle{transition:none}
}
.toc-toggle{
  border:none; background:transparent; color:var(--muted); cursor:pointer;
  font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
  padding:0; flex:none; white-space:nowrap;
}
.toc-toggle:hover{color:var(--accent)}
.doc h3, .doc h4{scroll-margin-top:14px}

/* ---------- chooser ---------- */
.choice{display:flex; flex-direction:column; gap:7px}
.choice .btn{text-align:left; padding:11px 13px; line-height:1.35}
.choice .btn small{display:block; font-size:12px; color:var(--muted); margin-top:2px}
.home-blank{
  border:1px dashed var(--line-2); border-radius:10px; padding:30px 24px;
  color:var(--muted); font-size:14px;
}
