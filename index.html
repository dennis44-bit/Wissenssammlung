<div class="app">
  <header class="topbar">
    <button class="btn ghost" id="nav-btn" title="Themen" aria-label="Themen anzeigen" aria-expanded="false">☰</button>
    <button class="btn ghost" id="accent-btn" title="Farbe ändern" aria-label="Farbe ändern"><span class="swatch"></span></button>
    <button class="btn ghost" id="undo-btn" title="Rückgängig (⌘Z)" aria-label="Rückgängig" disabled>↶</button>
    <div class="status" id="status"><span class="dot"></span><span id="status-text">Gesichert</span></div>
    <button class="btn primary" id="save-btn" disabled>Sichern</button>
  </header>
  <div class="body">
    <div class="nav-scrim" id="nav-scrim"></div>
    <nav class="rail" id="rail" aria-label="Themengebiete"></nav>
    <main class="main"><div class="sheet" id="sheet"></div></main>
  </div>
</div>
<div id="overlay"></div>

<script id="app-data" type="application/json">{"groups":[],"selected":null,"home":{"eyebrow":"Wissenssammlung","title":"Themengebiete","intro":""}}</script>

<script id="app-script">
(function () {
  "use strict";

  var raw = document.getElementById("app-data").textContent;
  var state = JSON.parse(raw);
  if (!state.groups) state.groups = [];

  var dirty = false;
  var editing = false;
  var draft = null;
  var readOnly = false;
  var activeSync = null;
  var homeEditing = false;
  var homeDraft = null;
  var history = [];
  var redoStack = [];
  var activeText = null;

  document.addEventListener("selectionchange", function () {
    if (activeSync) activeSync();
  });

  var railEl = document.getElementById("rail");
  var sheetEl = document.getElementById("sheet");
  var overlayEl = document.getElementById("overlay");
  var saveBtn = document.getElementById("save-btn");
  var statusEl = document.getElementById("status");
  var statusText = document.getElementById("status-text");

  var undoBtn = document.getElementById("undo-btn");
  var appEl = document.querySelector(".app");
  var navBtn = document.getElementById("nav-btn");
  var navScrim = document.getElementById("nav-scrim");

  /* Am Handy liegt die Themenliste als Schublade über dem Inhalt. */
  function setNav(offen) {
    appEl.classList.toggle("nav-open", offen);
    navBtn.setAttribute("aria-expanded", offen ? "true" : "false");
  }
  navBtn.addEventListener("click", function () {
    setNav(!appEl.classList.contains("nav-open"));
  });
  navScrim.addEventListener("click", function () {
    setNav(false);
  });
  /* Each palette gives the five accent tokens for light and for dark, so a
     colour change never leaves one theme with the other theme's accent. */
  var ACCENTS = {
    gruen: { name: "Grün",
      l: { a: "#1E6B4F", i: "#0E4433", s: "#E3EFE8", n: "#B7D5C6", o: "#FFFFFF" },
      d: { a: "#5FC79A", i: "#A8E3C7", s: "#1A2C24", n: "#2C4A3B", o: "#0F1412" } },
    blau: { name: "Blau",
      l: { a: "#1D5B8F", i: "#0D3A5E", s: "#E2EDF6", n: "#B4CFE4", o: "#FFFFFF" },
      d: { a: "#6AB8EF", i: "#AFD8F5", s: "#16242F", n: "#2A4356", o: "#0F1412" } },
    violett: { name: "Violett",
      l: { a: "#5B4396", i: "#3A2A63", s: "#EBE7F6", n: "#C8BDE4", o: "#FFFFFF" },
      d: { a: "#A891E8", i: "#CDBEF5", s: "#221D33", n: "#3B3259", o: "#0F1412" } },
    bernstein: { name: "Bernstein",
      l: { a: "#8F5E17", i: "#5C3B0C", s: "#F6EEDC", n: "#E0C89A", o: "#FFFFFF" },
      d: { a: "#DFAA57", i: "#F0CE95", s: "#2C2415", n: "#4A3B22", o: "#0F1412" } },
    ziegel: { name: "Ziegelrot",
      l: { a: "#9A3B2C", i: "#63251A", s: "#F7E7E3", n: "#E0B9B0", o: "#FFFFFF" },
      d: { a: "#E58A76", i: "#F3B8AA", s: "#2E1C18", n: "#4C2F27", o: "#0F1412" } },
    schiefer: { name: "Schiefer",
      l: { a: "#3E4C56", i: "#25313A", s: "#E8ECEF", n: "#C2CCD3", o: "#FFFFFF" },
      d: { a: "#9DB2C0", i: "#C6D4DD", s: "#1D242A", n: "#33414B", o: "#0F1412" } }
  };

  function accentKey() {
    return state.accent && ACCENTS[state.accent] ? state.accent : "gruen";
  }

  function applyAccent() {
    var t = ACCENTS[accentKey()];
    function vars(v) {
      return (
        "--accent:" + v.a + ";--accent-ink:" + v.i + ";--accent-soft:" + v.s +
        ";--accent-line:" + v.n + ";--on-accent:" + v.o + ";"
      );
    }
    var el = document.getElementById("accent-style");
    if (!el) {
      el = document.createElement("style");
      el.id = "accent-style";
      /* appended last so it wins over the palette in app-style */
      document.body.appendChild(el);
    }
    el.textContent =
      ":root{" + vars(t.l) + "}" +
      '@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){' + vars(t.d) + "}}" +
      ':root[data-theme="dark"]{' + vars(t.d) + "}";
  }

  function pickAccent() {
    var cur = accentKey();
    var opts = [];
    Object.keys(ACCENTS).forEach(function (k) {
      opts.push({
        label: ACCENTS[k].name + (k === cur ? "  ·  aktuell" : ""),
        dot: ACCENTS[k].l.a,
        fn: function () {
          if (k === cur) return;
          snapshot();
          state.accent = k;
          markDirty();
          applyAccent();
          render();
          toast("Farbe: " + ACCENTS[k].name);
        }
      });
    });
    chooser("Farbe der Sammlung", "Gilt für helle und dunkle Ansicht.", opts);
  }

  /* ---------- helpers ---------- */

  /* collapsed groups are a per-browser view preference, not saved content */
  /* Einmal aus dem Speicher lesen und danach im Kopf behalten — ohne
     localStorage (privates Fenster) würde sonst jeder Klick wieder zuklappen. */
  var collapsed = (function () {
    try {
      var v = JSON.parse(localStorage.getItem("tg-collapsed") || "[]");
      return Array.isArray(v) ? v : [];
    } catch (e) {
      return [];
    }
  })();

  function collapsedGroups() {
    return collapsed;
  }

  function toggleGroup(id, wrap) {
    var i = collapsed.indexOf(id);
    var close = i < 0;
    if (close) collapsed.push(id);
    else collapsed.splice(i, 1);
    try {
      localStorage.setItem("tg-collapsed", JSON.stringify(collapsed));
    } catch (e) {}
    if (!wrap) {
      renderRail();
      return;
    }
    /* Nur umschalten: ein Neuaufbau der Leiste flackert und würde beim
       Schreiben den Cursor aus dem Text holen. */
    wrap.classList.toggle("collapsed", close);
    var btn = wrap.querySelector(".group-toggle");
    if (btn) {
      btn.setAttribute("aria-expanded", close ? "false" : "true");
      btn.title = close ? "Themen zeigen" : "Themen einklappen";
    }
    slide(wrap.querySelector(".group-list"), !close);
  }

  /* Von der gemessenen Höhe auf 0 und zurück — "auto" lässt sich nicht animieren. */
  function slide(el, open) {
    if (!el) return;
    if (el._slide) {
      clearTimeout(el._slide);
      el._slide = null;
    }
    var h = el.scrollHeight;
    if (open) {
      el.style.height = el.style.height || "0px";
      void el.offsetHeight;
      el.style.height = h + "px";
      el._slide = setTimeout(function () {
        el.style.height = "";
        el._slide = null;
      }, 220);
    } else {
      el.style.height = h + "px";
      void el.offsetHeight;
      el.style.height = "0px";
    }
  }

  function uid(p) {
    return p + Math.random().toString(36).slice(2, 9);
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function allTopics() {
    var out = [];
    state.groups.forEach(function (g) {
      g.topics.forEach(function (t) {
        out.push({ group: g, topic: t });
      });
    });
    return out;
  }

  function findTopic(id) {
    var hit = null;
    allTopics().forEach(function (e) {
      if (e.topic.id === id) hit = e;
    });
    return hit;
  }

  function current() {
    return state.selected ? findTopic(state.selected) : null;
  }

  /* EIN Verlauf für alles: Tippen, Formatieren, Umbenennen, Verschieben,
     Löschen, Farbe. Zwei Sorten Schritte —
       "doc"  = das ganze Dokument vor der Änderung
       "text" = der Inhalt eines Themas (oder der Einleitung) vor der Änderung
     Der Text wird einzeln geführt, weil ein Dokument-Abzug pro Tastendruck
     zu schwer wäre. */
  function pushUndo(entry) {
    history.push(entry);
    if (history.length > 80) history.shift();
    redoStack.length = 0;
    syncUndo();
  }

  function snapshot() {
    try {
      pushUndo({ kind: "doc", state: JSON.stringify(state) });
    } catch (e) {}
  }

  function textOf(key) {
    if (activeText && activeText.key === key) return activeText.get();
    if (key === "__home") return state.home.intro;
    var hit = findTopic(key);
    return hit ? hit.topic.html : "";
  }

  /* Der Gegenschritt zum gerade zurückgenommenen — damit ↷ wieder vorgeht. */
  function counterStep(entry) {
    if (entry.kind === "doc") return { kind: "doc", state: JSON.stringify(state) };
    return { kind: "text", key: entry.key, html: textOf(entry.key) };
  }

  function applyStep(entry) {
    if (entry.kind === "doc") {
      var restored;
      try {
        restored = JSON.parse(entry.state);
      } catch (e) {
        return;
      }
      state = restored;
      applyAccent();
      /* Angefangenen, noch nicht übernommenen Text nicht wegwerfen —
         der Schritt betraf das Dokument, nicht den offenen Editor. */
      if (homeEditing) {
        homeDraft = {
          eyebrow: state.home.eyebrow,
          title: state.home.title,
          addEyebrow: false,
          addTitle: false,
          addIntro: false
        };
      } else {
        homeDraft = null;
      }
      if (editing && !current()) {
        editing = false;
        draft = null;
      }
      markDirty();
      render();
      return;
    }
    if (activeText && activeText.key === entry.key) {
      activeText.set(entry.html);
      markDirty();
      return;
    }
    /* Editor gerade zu — dann direkt ins Dokument schreiben */
    var clean = sanitize(entry.html);
    if (entry.key === "__home") state.home.intro = clean;
    else {
      var hit = findTopic(entry.key);
      if (hit) hit.topic.html = clean;
    }
    draft = null;
    markDirty();
    render();
  }

  function syncUndo() {
    if (!undoBtn) return;
    undoBtn.disabled = history.length === 0;
    undoBtn.title = history.length
      ? "Rückgängig (⌘Z) — " + history.length + " Schritte möglich"
      : "Nichts rückgängig zu machen";
  }

  function undo() {
    if (!history.length) return;
    var entry = history.pop();
    redoStack.push(counterStep(entry));
    applyStep(entry);
    syncUndo();
  }

  function redo() {
    if (!redoStack.length) return;
    var entry = redoStack.pop();
    history.push(counterStep(entry));
    applyStep(entry);
    syncUndo();
  }

  function markDirty() {
    dirty = true;
    if (readOnly) return;
    saveBtn.disabled = false;
    statusEl.classList.add("dirty");
    statusText.textContent = "Nicht gesichert";
  }

  function goReadOnly() {
    readOnly = true;
    saveBtn.disabled = true;
    statusEl.classList.remove("dirty");
    statusText.textContent = "Nur lesen";
  }

  function toast(msg) {
    var old = document.querySelector(".toast");
    if (old) old.remove();
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function () {
      el.remove();
    }, 2600);
  }

  /* ---------- text rendering ---------- */

  function inline(s) {
    var t = esc(s);
    t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/(^|[\s(])_([^_]+)_(?=[\s.,;:)!?]|$)/g, "$1<em>$2</em>");
    return t;
  }

  function renderDoc(src) {
    var lines = String(src || "").replace(/\r/g, "").split("\n");
    var html = "";
    var i = 0;

    function collectItems() {
      var items = [];
      while (i < lines.length) {
        var m = lines[i].match(/^(\s*)(?:([-•*])|(\d+)\.)\s+(.*)$/);
        if (!m) break;
        items.push({
          depth: Math.min(Math.floor(m[1].length / 2), 2),
          ordered: !!m[3],
          text: m[4]
        });
        i++;
      }
      return items;
    }

    function buildList(items, p, depth) {
      var tag = items[p.i].ordered ? "ol" : "ul";
      var out = "<" + tag + ">";
      var hasItem = false;
      while (p.i < items.length) {
        var it = items[p.i];
        if (it.depth < depth) break;
        if (it.depth > depth) {
          if (hasItem) {
            out = out.replace(/<\/li>$/, "");
            out += buildList(items, p, depth + 1) + "</li>";
          } else {
            out += "<li>" + buildList(items, p, depth + 1) + "</li>";
            hasItem = true;
          }
          continue;
        }
        if ((it.ordered ? "ol" : "ul") !== tag) break;
        out += "<li>" + inline(it.text) + "</li>";
        hasItem = true;
        p.i++;
      }
      return out + "</" + tag + ">";
    }

    while (i < lines.length) {
      var line = lines[i];

      if (!line.trim()) {
        i++;
        continue;
      }

      var h = line.match(/^(#{2,4})\s+(.*)$/);
      if (h) {
        var lvl = h[1].length + 1;
        html += "<h" + lvl + ">" + inline(h[2]) + "</h" + lvl + ">";
        i++;
        continue;
      }

      if (/^\s*(-{3,}|_{3,})\s*$/.test(line)) {
        html += "<hr>";
        i++;
        continue;
      }

      if (/^\s*\|/.test(line)) {
        var rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          var cells = lines[i].trim().replace(/^\||\|$/g, "").split("|");
          if (!/^[\s|:-]+$/.test(lines[i])) rows.push(cells);
          i++;
        }
        if (rows.length) {
          var tbl = '<div class="table-wrap"><table><thead><tr>';
          rows[0].forEach(function (c) {
            tbl += "<th>" + inline(c.trim()) + "</th>";
          });
          tbl += "</tr></thead><tbody>";
          rows.slice(1).forEach(function (r) {
            tbl += "<tr>";
            r.forEach(function (c) {
              tbl += "<td>" + inline(c.trim()) + "</td>";
            });
            tbl += "</tr>";
          });
          tbl += "</tbody></table></div>";
          html += tbl;
        }
        continue;
      }

      if (/^\s*(?:[-•*]|\d+\.)\s+/.test(line)) {
        var items = collectItems();
        var p = { i: 0 };
        while (p.i < items.length) html += buildList(items, p, items[p.i].depth);
        continue;
      }

      var para = [];
      while (
        i < lines.length &&
        lines[i].trim() &&
        !/^\s*(?:[-•*]|\d+\.)\s+/.test(lines[i]) &&
        !/^#{2,4}\s/.test(lines[i]) &&
        !/^\s*\|/.test(lines[i])
      ) {
        para.push(lines[i].trim());
        i++;
      }
      html += "<p>" + inline(para.join(" ")) + "</p>";
    }

    return html;
  }

  /* ---------- modal ---------- */

  function modal(opts) {
    overlayEl.innerHTML = "";
    var scrim = document.createElement("div");
    scrim.className = "scrim";

    var fields = opts.fields || [];
    var inputsHtml = fields
      .map(function (f) {
        return (
          '<div class="field"><label for="f-' +
          f.key +
          '">' +
          esc(f.label) +
          '</label><input id="f-' +
          f.key +
          '" value="' +
          esc(f.value || "") +
          '" ' +
          /* sonst macht die iPhone-Tastatur aus https:// ein Https:// */
          'autocapitalize="none" autocorrect="off" spellcheck="false" ' +
          (f.mode ? 'inputmode="' + esc(f.mode) + '" ' : "") +
          (f.placeholder ? 'placeholder="' + esc(f.placeholder) + '"' : "") +
          "></div>"
        );
      })
      .join("");

    scrim.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
      "<h3>" + esc(opts.title) + "</h3>" +
      (opts.text ? "<p>" + esc(opts.text) + "</p>" : "") +
      (fields.length
        ? '<div class="' + (fields.length > 1 && !opts.stack ? "row2" : "") + '">' + inputsHtml + "</div>"
        : "") +
      '<p class="modal-warn" hidden></p>' +
      '<div class="modal-actions">' +
      '<button class="btn" data-act="cancel">Abbrechen</button>' +
      '<button class="btn ' +
      (opts.danger ? "danger" : "primary") +
      '" data-act="ok">' +
      esc(opts.confirm || "Speichern") +
      "</button>" +
      "</div></div>";

    overlayEl.appendChild(scrim);
    var first = scrim.querySelector("input");
    if (first) {
      first.focus();
      first.select();
    } else {
      scrim.querySelector('[data-act="ok"]').focus();
    }

    function close() {
      overlayEl.innerHTML = "";
      document.removeEventListener("keydown", onKey);
    }
    var warnEl = scrim.querySelector(".modal-warn");
    [].slice.call(scrim.querySelectorAll("input")).forEach(function (el) {
      el.addEventListener("input", function () {
        el.removeAttribute("aria-invalid");
        warnEl.hidden = true;
      });
    });

    function submit() {
      var vals = {};
      var missing = null;
      fields.forEach(function (f) {
        var el = scrim.querySelector("#f-" + f.key);
        vals[f.key] = el.value.trim();
        if (f.required && !vals[f.key] && !missing) missing = { f: f, el: el };
      });
      /* Ein leeres Pflichtfeld hat den Dialog früher stillschweigend geschlossen —
         das sah aus, als käme der alte Wert nach dem Speichern zurück. */
      if (missing) {
        warnEl.textContent = "\u201E" + missing.f.label + "\u201C darf nicht leer sein.";
        warnEl.hidden = false;
        missing.el.setAttribute("aria-invalid", "true");
        missing.el.focus();
        return;
      }
      close();
      opts.onOk(vals);
    }
    function onKey(e) {
      if (e.key === "Escape") close();
      if (e.key === "Enter" && scrim.contains(document.activeElement)) submit();
    }

    scrim.addEventListener("click", function (e) {
      if (e.target === scrim) close();
      var hit = e.target.closest ? e.target.closest("[data-act]") : null;
      var act = hit && hit.getAttribute("data-act");
      if (act === "cancel") close();
      if (act === "ok") submit();
    });
    document.addEventListener("keydown", onKey);
  }

  function chooser(title, text, actions) {
    overlayEl.innerHTML = "";
    var scrim = document.createElement("div");
    scrim.className = "scrim";
    var m = document.createElement("div");
    m.className = "modal";
    m.setAttribute("role", "dialog");
    m.setAttribute("aria-modal", "true");
    m.innerHTML = "<h3>" + esc(title) + "</h3>" + (text ? "<p>" + esc(text) + "</p>" : "");

    var list = document.createElement("div");
    list.className = "choice";
    actions.forEach(function (a) {
      var b = document.createElement("button");
      b.className = "btn";
      b.type = "button";
      b.innerHTML =
        (a.dot ? '<span class="dot" style="background:' + esc(a.dot) + '"></span>' : "") +
        esc(a.label) +
        (a.hint ? "<small>" + esc(a.hint) + "</small>" : "");
      b.addEventListener("click", function () {
        close();
        a.fn();
      });
      list.appendChild(b);
    });
    m.appendChild(list);

    var foot = document.createElement("div");
    foot.className = "modal-actions";
    var cancel = document.createElement("button");
    cancel.className = "btn ghost";
    cancel.textContent = "Abbrechen";
    cancel.addEventListener("click", function () {
      close();
    });
    foot.appendChild(cancel);
    m.appendChild(foot);

    scrim.appendChild(m);
    overlayEl.appendChild(scrim);
    list.querySelector(".btn").focus();

    function close() {
      overlayEl.innerHTML = "";
      document.removeEventListener("keydown", onKey);
    }
    function onKey(e) {
      if (e.key === "Escape") close();
    }
    scrim.addEventListener("click", function (e) {
      if (e.target === scrim) close();
    });
    document.addEventListener("keydown", onKey);
  }

  /* Numbers are free text ("3", "8", "10") — compare the leading number,
     fall back to the text so "3a" still lands next to "3". */
  function byNum(a, b) {
    var na = parseFloat(String(a.num).replace(",", "."));
    var nb = parseFloat(String(b.num).replace(",", "."));
    if (isNaN(na) && isNaN(nb)) return String(a.num).localeCompare(String(b.num), "de");
    if (isNaN(na)) return 1;
    if (isNaN(nb)) return -1;
    if (na !== nb) return na - nb;
    return String(a.num).localeCompare(String(b.num), "de");
  }

  function organise(g) {
    chooser("Themen ordnen", "In „" + g.name + "“", [
      {
        label: "Nach Nummer sortieren",
        hint: "Reihenfolge nach der vorangestellten Zahl",
        fn: function () {
          snapshot();
          g.topics.sort(byNum);
          markDirty();
          render();
          toast("Nach Nummer sortiert.");
        }
      },
      {
        label: "Alphabetisch sortieren",
        hint: "Reihenfolge nach dem Titel",
        fn: function () {
          snapshot();
          g.topics.sort(function (a, b) {
            return String(a.title).localeCompare(String(b.title), "de");
          });
          markDirty();
          render();
          toast("Alphabetisch sortiert.");
        }
      },
      {
        label: "Neu durchnummerieren",
        hint: "Vergibt 1 bis " + g.topics.length + " in der aktuellen Reihenfolge",
        fn: function () {
          snapshot();
          g.topics.forEach(function (t, i) {
            t.num = String(i + 1);
          });
          markDirty();
          render();
          toast("Neu durchnummeriert.");
        }
      },
      {
        label: "Leere Themen ans Ende",
        hint: "Themen ohne Inhalt nach unten, Reihenfolge bleibt sonst",
        fn: function () {
          snapshot();
          var full = g.topics.filter(function (t) {
            return !isEmptyHtml(t.html);
          });
          var empty = g.topics.filter(function (t) {
            return isEmptyHtml(t.html);
          });
          g.topics = full.concat(empty);
          markDirty();
          render();
          toast("Leere Themen nach unten geschoben.");
        }
      }
    ]);
  }

  /* ---------- rail ---------- */

  /* Alles zum Umbenennen, Verschieben und Löschen gehört in den Bearbeiten-Modus.
     Beim reinen Lesen bleibt die Seitenleiste reine Navigation. */
  function toolsVisible() {
    /* In einer leeren Sammlung sind die Werkzeuge immer da — sonst käme man
       nie an das erste Überthema heran. */
    return editing || homeEditing || !allTopics().length;
  }

  function renderRail() {
    railEl.innerHTML = "";

    var home = document.createElement("button");
    home.className = "rail-home";
    home.setAttribute("aria-current", state.selected ? "false" : "true");
    home.innerHTML = '<span class="glyph">\u25A6</span><span>Übersicht</span>';
    home.addEventListener("click", function () {
      select(null);
    });
    railEl.appendChild(home);

    state.groups.forEach(function (g, gi) {
      var wrap = document.createElement("section");
      wrap.className = "group";

      var head = document.createElement("div");
      head.className = "group-head";
      var isCollapsed = collapsedGroups().indexOf(g.id) >= 0;
      if (isCollapsed) wrap.classList.add("collapsed");
      var holdsCurrent = g.topics.some(function (t) {
        return t.id === state.selected;
      });

      head.innerHTML =
        '<button class="group-toggle" type="button" data-act="toggle"' +
        (holdsCurrent ? ' data-here="true"' : "") +
        ' aria-expanded="' + (isCollapsed ? "false" : "true") + '"' +
        ' title="' + (isCollapsed ? "Themen zeigen" : "Themen einklappen") + '">' +
        '<span class="chev">▼</span><span class="nm">' + esc(g.name) + "</span>" +
        '<span class="cnt">' + g.topics.length + "</span>" +
        "</button>" +
        (toolsVisible()
          ? '<span class="tools">' +
            '<button class="icon" title="Thema hinzufügen" data-act="add-topic">+</button>' +
            '<button class="icon" title="Themen ordnen" data-act="sort">⇅</button>' +
            '<button class="icon" title="Überthema umbenennen" data-act="ren-group">✎</button>' +
            '<button class="icon del" title="Überthema löschen" data-act="del-group">✕</button>' +
            '<button class="icon" title="Nach oben" data-act="up-group"' + (gi === 0 ? " disabled" : "") + ">↑</button>" +
            '<button class="icon" title="Nach unten" data-act="down-group"' +
            (gi === state.groups.length - 1 ? " disabled" : "") + ">↓</button>" +
            "</span>"
          : "");
      head.addEventListener("dblclick", function (e) {
        if (e.target.closest && e.target.closest(".group-toggle")) renameGroup(g);
      });
      head.addEventListener("click", function (e) {
        /* Der Klick landet meist auf einem <span> im Knopf (Pfeil, Name,
           Zähler) — von dort aus den Knopf mit der Aktion suchen. */
        var hit = e.target.closest ? e.target.closest("[data-act]") : null;
        var act = hit && hit.getAttribute("data-act");
        if (!act) return;
        if (act === "toggle") {
          toggleGroup(g.id, wrap);
          return;
        }
        if (act === "add-topic") addTopic(g);
        if (act === "sort") organise(g);
        if (act === "ren-group") renameGroup(g);
        if (act === "del-group") deleteGroup(g);
        if (act === "up-group") moveGroup(gi, -1);
        if (act === "down-group") moveGroup(gi, 1);
      });
      wrap.appendChild(head);

      var listBox = document.createElement("div");
      listBox.className = "group-list";
      if (isCollapsed) listBox.style.height = "0px";
      wrap.appendChild(listBox);

      if (toolsVisible()) {
        /* auf freier Fläche ablegen = ans Ende dieses Überthemas */
        listBox.addEventListener("dragover", function (e) {
          if (!dragId) return;
          e.preventDefault();
          clearDropMarks();
          listBox.classList.add("drop-end");
        });
        listBox.addEventListener("drop", function (e) {
          if (!dragId) return;
          e.preventDefault();
          var id = dragId;
          dragId = null;
          clearDropMarks();
          dropTopic(id, g, g.topics.length);
        });
      }

      if (!g.topics.length) {
        var none = document.createElement("div");
        none.style.cssText =
          "padding:4px 8px 6px;font-size:12.5px;color:var(--muted)";
        none.textContent = "Noch keine Themen";
        listBox.appendChild(none);
      }

      g.topics.forEach(function (t) {
        var b = document.createElement("button");
        b.className = "topic";
        b.setAttribute("aria-current", t.id === state.selected ? "true" : "false");
        if (toolsVisible()) {
          b.draggable = true;
          b.title = "Ziehen, um die Reihenfolge zu ändern";
          b.addEventListener("dragstart", function (e) {
            dragId = t.id;
            b.classList.add("dragging");
            try {
              e.dataTransfer.effectAllowed = "move";
              e.dataTransfer.setData("text/plain", t.id);
            } catch (err) {}
          });
          b.addEventListener("dragend", function () {
            dragId = null;
            b.classList.remove("dragging");
            clearDropMarks();
          });
          b.addEventListener("dragover", function (e) {
            if (!dragId || dragId === t.id) return;
            e.preventDefault();
            e.stopPropagation();
            try {
              e.dataTransfer.dropEffect = "move";
            } catch (err) {}
            var r = b.getBoundingClientRect();
            var unten = e.clientY - r.top > r.height / 2;
            clearDropMarks();
            b.classList.add(unten ? "drop-after" : "drop-before");
          });
          b.addEventListener("drop", function (e) {
            if (!dragId) return;
            e.preventDefault();
            e.stopPropagation();
            var r = b.getBoundingClientRect();
            var unten = e.clientY - r.top > r.height / 2;
            var id = dragId;
            dragId = null;
            clearDropMarks();
            dropTopic(id, g, g.topics.indexOf(t) + (unten ? 1 : 0));
          });
        }
        b.innerHTML =
          (String(t.num || "").trim() ? '<span class="num">' + esc(t.num) + "</span>" : "") +
          '<span class="label">' + esc(t.title) + "</span>" +
          (isEmptyHtml(t.html) ? '<span class="empty-dot" title="Noch leer"></span>' : "");
        b.addEventListener("click", function () {
          select(t.id);
        });
        listBox.appendChild(b);
      });

      railEl.appendChild(wrap);
    });

    if (toolsVisible()) {
      var actions = document.createElement("div");
      actions.className = "rail-actions";
      var addG = document.createElement("button");
      addG.className = "btn";
      addG.textContent = "+ Überthema";
      addG.addEventListener("click", addGroup);
      actions.appendChild(addG);
      railEl.appendChild(actions);
    }


  }

  /* ---------- main ---------- */

  /* Umbenennen, Verschieben, Löschen — sichtbar nur im Bearbeiten-Modus */
  function appendTopicTools(bar, cur) {
    var ren = document.createElement("button");
    ren.className = "btn";
    ren.textContent = "Umbenennen";
    ren.addEventListener("click", function () {
      renameTopic(cur.topic);
    });
    bar.appendChild(ren);

    var idx = cur.group.topics.indexOf(cur.topic);
    var up = document.createElement("button");
    up.className = "btn sm";
    up.textContent = "↑";
    up.title = "Nach oben";
    up.disabled = idx === 0;
    up.addEventListener("click", function () {
      moveTopic(cur.group, idx, -1);
    });
    var down = document.createElement("button");
    down.className = "btn sm";
    down.textContent = "↓";
    down.title = "Nach unten";
    down.disabled = idx === cur.group.topics.length - 1;
    down.addEventListener("click", function () {
      moveTopic(cur.group, idx, 1);
    });
    bar.appendChild(up);
    bar.appendChild(down);

    if (state.groups.length > 1) {
      var sel = document.createElement("select");
      sel.title = "In anderes Überthema verschieben";
      state.groups.forEach(function (g) {
        var o = document.createElement("option");
        o.value = g.id;
        o.textContent = g.name;
        if (g === cur.group) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener("change", function () {
        moveTopicToGroup(cur.group, cur.topic, sel.value);
      });
      bar.appendChild(sel);
    }

    var sp = document.createElement("div");
    sp.className = "spacer";
    bar.appendChild(sp);

    var del = document.createElement("button");
    del.className = "btn ghost danger";
    del.textContent = "Löschen";
    del.addEventListener("click", function () {
      deleteTopic(cur.group, cur.topic);
    });
    bar.appendChild(del);
  }

  function renderMain() {
    var cur = current();
    sheetEl.innerHTML = "";
    sheetEl.classList.remove("home");

    if (!cur) {
      renderLanding();
      return;
    }

    var crumb = document.createElement("div");
    crumb.className = "crumb";
    crumb.textContent = cur.group.name;
    sheetEl.appendChild(crumb);

    var row = document.createElement("div");
    row.className = "title-row";
    row.innerHTML =
      (String(cur.topic.num || "").trim()
        ? '<div class="title-num">' + esc(cur.topic.num) + "</div>"
        : "") +
      '<h2 class="title">' + esc(cur.topic.title) + "</h2>";
    sheetEl.appendChild(row);

    var bar = document.createElement("div");
    bar.className = "toolbar";
    sheetEl.appendChild(bar);

    if (editing) {
      var done = document.createElement("button");
      done.className = "btn primary";
      done.textContent = "Fertig";
      done.addEventListener("click", function () {
        commitDraft();
        editing = false;
        render();
      });
      var cancel = document.createElement("button");
      cancel.className = "btn ghost";
      cancel.textContent = "Verwerfen";
      cancel.addEventListener("click", function () {
        draft = null;
        editing = false;
        render();
      });
      bar.appendChild(done);
      bar.appendChild(cancel);
      appendTopicTools(bar, cur);

      sheetEl.appendChild(buildEditor(cur.topic));
      return;
    }

    var edit = document.createElement("button");
    edit.className = "btn";
    edit.textContent = "Bearbeiten";
    edit.addEventListener("click", startEditing);
    bar.appendChild(edit);

    if (!isEmptyHtml(cur.topic.html)) {
      var doc = document.createElement("article");
      doc.className = "doc";
      doc.title = "Doppelklick zum Bearbeiten";
      doc.innerHTML = displayHtml(cur.topic.html);
      doc.addEventListener("dblclick", startEditing);
      var toc = buildToc(doc, function (h) {
        /* hart, nicht weich: weiches Scrollen in diesem Behälter wird in
           manchen Browsern verworfen und der Sprung passiert dann gar nicht */
        h.scrollIntoView({ block: "start", behavior: "auto" });
        flashHeading(h);
      });
      if (toc.refresh() >= 2) sheetEl.appendChild(toc.box);
      sheetEl.appendChild(doc);
    } else {
      var blank = document.createElement("div");
      blank.className = "blank";
      blank.innerHTML = "<p>Dieses Thema ist noch leer.</p>";
      var b2 = document.createElement("button");
      b2.className = "btn primary";
      b2.textContent = "Inhalt schreiben";
      b2.addEventListener("click", startEditing);
      blank.appendChild(b2);
      sheetEl.appendChild(blank);
    }
  }

  function excerpt(html, max) {
    var tmp = document.createElement("div");
    /* block boundaries are word boundaries — otherwise headings glue to the next line */
    tmp.innerHTML = String(html || "")
      .replace(/<\/(h[3-5]|p|li|td|th|tr)>/gi, "$& ")
      .replace(/<br\s*\/?>/gi, "$& ");
    var txt = tmp.textContent.replace(/\s+/g, " ").trim();
    if (txt.length <= max) return txt;
    var cut = txt.slice(0, max);
    var sp = cut.lastIndexOf(" ");
    return (sp > max * 0.6 ? cut.slice(0, sp) : cut) + " …";
  }

  function startHomeEditing() {
    homeDraft = {
      eyebrow: state.home.eyebrow,
      title: state.home.title,
      addEyebrow: false,
      addTitle: false,
      addIntro: false
    };
    homeEditing = true;
    draft = null;
    render();
  }

  function commitHome(skipRender) {
    commitDraft();
    if (homeDraft) {
      var e = (homeDraft.eyebrow || "").replace(/\s+/g, " ").trim();
      /* leer heißt leer — nicht heimlich auf den alten Titel zurückfallen */
      var t = (homeDraft.title || "").replace(/\s+/g, " ").trim();
      if (e !== state.home.eyebrow || t !== state.home.title) {
        snapshot();
        state.home.eyebrow = e;
        state.home.title = t;
        markDirty();
      }
    }
    homeEditing = false;
    homeDraft = null;
    if (!skipRender) render();
  }

  function renderLanding() {
    sheetEl.classList.add("home");

    var all = allTopics();
    var shown = homeEditing ? homeDraft : state.home;

    var bar = document.createElement("div");
    bar.className = "home-bar";
    if (homeEditing) {
      var done = document.createElement("button");
      done.className = "btn primary";
      done.textContent = "Fertig";
      done.addEventListener("click", function () {
        commitHome();
      });
      var cancel = document.createElement("button");
      cancel.className = "btn ghost";
      cancel.textContent = "Verwerfen";
      cancel.addEventListener("click", function () {
        homeEditing = false;
        homeDraft = null;
        draft = null;
        render();
      });
      bar.appendChild(done);
      bar.appendChild(cancel);
    } else {
      var edit = document.createElement("button");
      edit.className = "btn";
      edit.textContent = "Text bearbeiten";
      edit.addEventListener("click", startHomeEditing);
      bar.appendChild(edit);
    }
    /* Ein leeres Feld wird nicht gezeichnet — auch nicht beim Bearbeiten.
       Zurückholen geht über die "+"-Knöpfe, die dann in der Leiste stehen. */
    var introEmpty = isEmptyHtml(state.home.intro);
    /* beim Bearbeiten zählt, was gerade im Editor steht, nicht der gesicherte Stand */
    var introEmptyNow = homeEditing && draft !== null
      ? isEmptyHtml(sanitize(draft))
      : introEmpty;
    var eyebrowEmpty = !String(shown.eyebrow || "").trim();
    var titleEmpty = !String(shown.title || "").trim();
    var showEyebrow = !eyebrowEmpty || (homeEditing && homeDraft.addEyebrow);
    var showTitle = !titleEmpty || (homeEditing && homeDraft.addTitle);
    var showIntro = homeEditing
      ? !introEmptyNow || homeDraft.addIntro
      : !introEmpty;

    if (homeEditing) {
      [["addEyebrow", showEyebrow, eyebrowEmpty, "Vorzeile", ".home-eyebrow[contenteditable]", "eyebrow"],
       ["addTitle", showTitle, titleEmpty, "Titel", "h2.home-field[contenteditable]", "title"],
       ["addIntro", showIntro, introEmptyNow, "Einleitung", ".editable", null]]
        .reverse()
        .forEach(function (f) {
          /* + blendet ein, − nimmt wieder weg — auch samt Text.
             Zurück holt es "Verwerfen" oder ⌘Z nach dem Fertigstellen. */
          var shownNow = f[1];
          var wasFilled = shownNow && !f[2];
          var b = document.createElement("button");
          b.className = "btn" + (wasFilled ? " ghost danger" : "");
          b.textContent = (shownNow ? "− " : "+ ") + f[3];
          b.addEventListener("click", function () {
            /* Geschriebenes zuerst festhalten, dann einen Verlaufsschritt
               setzen — sonst wäre das Ein-/Ausblenden nicht rückgängig. */
            commitDraft();
            snapshot();
            homeDraft[f[0]] = !shownNow;
            if (shownNow) {
              if (f[5]) {
                homeDraft[f[5]] = "";
                state.home[f[5]] = "";
              } else {
                state.home.intro = "";
              }
              markDirty();
              if (wasFilled) toast(f[3] + " entfernt — ↶ holt es zurück.");
            }
            render();
            if (!shownNow) {
              var el = sheetEl.querySelector(f[4]);
              if (el) el.focus();
            }
          });
          bar.insertBefore(b, bar.firstChild);
        });
    }
    sheetEl.appendChild(bar);

    var eyebrow = document.createElement("p");
    eyebrow.className = "home-eyebrow home-field";
    eyebrow.textContent = shown.eyebrow;

    var title = document.createElement("h2");
    title.className = "home-field";
    title.textContent = shown.title;

    if (homeEditing) {
      [[eyebrow, "eyebrow", "Zeile über dem Titel"], [title, "title", "Titel der Sammlung"]]
        .forEach(function (f) {
          var el = f[0];
          el.contentEditable = "true";
          el.setAttribute("data-ph", f[2]);
          el.setAttribute("aria-label", f[2]);
          el.addEventListener("input", function () {
            homeDraft[f[1]] = el.textContent;
            markDirty();
          });
          el.addEventListener("keydown", function (e) {
            if (e.key === "Enter") e.preventDefault();
          });
          el.addEventListener("paste", function (e) {
            e.preventDefault();
            var txt = (e.clipboardData || window.clipboardData)
              .getData("text/plain")
              .replace(/\s+/g, " ");
            cmd("insertText", txt);
          });
        });
    }

    if (showEyebrow) sheetEl.appendChild(eyebrow);
    if (showTitle) sheetEl.appendChild(title);

    if (homeEditing && showIntro) {
      sheetEl.appendChild(buildEditor({ html: state.home.intro, title: "Einleitung" }));
    } else if (!homeEditing && !introEmpty) {
      var lead = document.createElement("div");
      lead.className = "doc home-lead-doc";
      lead.innerHTML = displayHtml(state.home.intro);
      lead.title = "Doppelklick zum Bearbeiten";
      lead.addEventListener("dblclick", startHomeEditing);
      sheetEl.appendChild(lead);
    }

    if (!all.length) {
      var blank = document.createElement("div");
      blank.className = "home-blank";
      if (readOnly) {
        /* Nicht verwechseln: leer heißt hier "nicht geladen", nicht "nichts da". */
        blank.innerHTML =
          "<b>Keine Verbindung zum Speicher.</b><br>" +
          "Deine Notizen sind nicht geladen — sie liegen unberührt auf dem Server. " +
          "Tippe oben auf den Verbindungsstand, um Adresse und Passwort zu prüfen. " +
          "Am einfachsten beides einfügen statt eintippen.";
      } else {
        blank.textContent =
          "Noch keine Themen angelegt. Leg ein Überthema an und darin dein erstes Thema.";
      }
      sheetEl.appendChild(blank);
      return;
    }

    state.groups.forEach(function (g) {
      var sec = document.createElement("section");
      sec.className = "home-group";

      /* Bei nur einem Überthema sagt die Überschrift nichts, was der Seitentitel
         nicht schon sagt — dann bleibt sie weg. */
      if (state.groups.length > 1) {
        var h = document.createElement("h3");
        var rename = document.createElement("button");
        rename.type = "button";
        rename.className = "grp-rename";
        rename.textContent = g.name;
        rename.title = "Überthema umbenennen";
        rename.addEventListener("click", function () {
          renameGroup(g);
        });
        var count = document.createElement("em");
        count.textContent =
          g.topics.length + (g.topics.length === 1 ? " Thema" : " Themen");
        h.appendChild(rename);
        h.appendChild(count);
        sec.appendChild(h);
      }

      if (!g.topics.length) {
        var none = document.createElement("div");
        none.className = "home-blank";
        none.textContent = "Noch keine Themen in diesem Überthema.";
        sec.appendChild(none);
        sheetEl.appendChild(sec);
        return;
      }

      var grid = document.createElement("div");
      grid.className = "cards";
      g.topics.forEach(function (t) {
        var empty = isEmptyHtml(t.html);
        var c = document.createElement("button");
        c.className = "card" + (empty ? " empty" : "");
        c.type = "button";
        c.innerHTML =
          (String(t.num || "").trim() ? '<span class="n">' + esc(t.num) + "</span>" : "") +
          '<span class="t">' + esc(t.title) + "</span>" +
          (empty
            ? '<span class="chip">Noch leer</span>'
            : '<span class="x">' + esc(excerpt(t.html, 130)) + "</span>");
        c.addEventListener("click", function () {
          select(t.id);
        });
        grid.appendChild(c);
      });
      sec.appendChild(grid);
      sheetEl.appendChild(sec);
    });
  }

  /* Gliederung aus den eigenen Überschriften — keine zweite Quelle, die
     auseinanderlaufen kann. refresh() baut die Liste neu; beim Schreiben wird
     sie nach jeder Änderung aufgerufen, damit sie mitwächst. */
  /* Nach dem Sprung kurz aufleuchten, damit man sieht, wo man gelandet ist.
     Die Klasse verschwindet von selbst wieder; beim Sichern fällt sie ohnehin
     weg, weil Attribute dabei entfernt werden. */
  function flashHeading(el) {
    if (!el) return;
    if (el._flash) clearTimeout(el._flash);
    el.classList.remove("toc-flash");
    void el.offsetWidth;
    el.classList.add("toc-flash");
    el._flash = setTimeout(function () {
      el.classList.remove("toc-flash");
      el._flash = null;
    }, 2400);
  }

  function buildToc(root, onPick, onMove, kannVerschieben) {
    var markiert = null;
    /* Die Gliederung ist beim Öffnen da — nur ihre Unterpunkte sind zu,
       siehe zugeklappt[] weiter unten. Ausblenden gilt für die gerade
       offene Ansicht und wird nicht gemerkt. */
    var collapsed = false;

    var box = document.createElement("nav");
    box.className = "toc";
    box.setAttribute("aria-label", "Gliederung");

    var head = document.createElement("div");
    head.className = "toc-head";
    var label = document.createElement("span");
    head.appendChild(label);

    var toggle = document.createElement("button");
    toggle.className = "toc-toggle";
    toggle.type = "button";
    head.appendChild(toggle);

    var list = document.createElement("ol");
    /* welche Hauptpunkte gerade zugeklappt sind — überlebt das Neuaufbauen
       der Liste beim Tippen */
    var zugeklappt = {};

    function sync() {
      list.style.display = collapsed ? "none" : "";
      toggle.textContent = collapsed ? "Zeigen" : "Ausblenden";
      box.style.paddingBottom = collapsed ? "13px" : "";
    }
    toggle.addEventListener("click", function () {
      collapsed = !collapsed;
      sync();
    });

    function refresh() {
      var heads = [].slice.call(root.querySelectorAll("h3, h4"));
      box.hidden = heads.length < 2;
      label.innerHTML = "<b>Gliederung</b> · " + heads.length + " Abschnitte";
      /* Nach einem Verschieben wird die Liste neu gebaut — die Markierung muss
         den Tastaturfokus behalten, sonst wirkt die nächste Pfeiltaste nicht. */
      var warFokus = list.contains(document.activeElement);
      list.innerHTML = "";

      var offeneGruppe = null;
      heads.forEach(function (h, i) {
        h.id = "abschnitt-" + i;
        var jump = document.createElement("button");
        jump.type = "button";
        jump.className = "jump";
        jump.textContent = h.textContent.trim() || "(ohne Überschrift)";
        jump.setAttribute("aria-selected", h === markiert ? "true" : "false");
        /* nicht den Cursor aus dem Text holen, bevor der Sprung passiert */
        jump.addEventListener("mousedown", function (e) {
          e.preventDefault();
        });
        jump.addEventListener("click", function () {
          if (onMove) {
            markiert = h;
            [].slice.call(list.querySelectorAll(".jump")).forEach(function (b) {
              b.setAttribute("aria-selected", b === jump ? "true" : "false");
            });
            try {
              jump.focus({ preventScroll: true });
            } catch (err) {
              jump.focus();
            }
          }
          onPick(h, !onMove);
        });
        /* markiert: mit den Pfeiltasten verschieben */
        jump.addEventListener("dblclick", function () {
          onPick(h, true);
        });
        jump.addEventListener("keydown", function (e) {
          if (!onMove) return;
          if (e.key === "ArrowUp" || e.key === "ArrowDown") {
            e.preventDefault();
            onMove(h, null, e.key === "ArrowUp" ? -1 : 1);
          } else if (e.key === "Enter") {
            e.preventDefault();
            onPick(h, true);
          }
        });

        /* Im Bearbeiten-Modus lässt sich die Reihenfolge ändern — der ganze
           Abschnitt unter der Überschrift wandert dabei mit. */
        var werkzeuge = null;
        if (onMove) {
          werkzeuge = document.createElement("span");
          werkzeuge.className = "ord";

          [["↑", -1, "Abschnitt nach oben"], ["↓", 1, "Abschnitt nach unten"]]
            .forEach(function (f) {
              var b = document.createElement("button");
              b.type = "button";
              b.textContent = f[0];
              b.title = f[2];
              b.setAttribute("aria-label", f[2]);
              b.addEventListener("mousedown", function (e) {
                e.preventDefault();
              });
              b.addEventListener("click", function () {
                onMove(h, null, f[1]);
              });
              if (kannVerschieben) b.disabled = !kannVerschieben(h, f[1]);
              werkzeuge.appendChild(b);
            });

          /* Anfasser: funktioniert mit Maus UND Finger, weil er auf
             Zeigereignisse hört statt auf das Datei-Ziehen des Browsers. */
          var griff = document.createElement("button");
          griff.type = "button";
          griff.className = "grip";
          griff.textContent = "⠿";
          griff.title = "Zum Verschieben ziehen";
          griff.setAttribute("aria-label", "Abschnitt verschieben");
          werkzeuge.appendChild(griff);

          griff.addEventListener("pointerdown", function (e) {
            e.preventDefault();
            e.stopPropagation();
            var startY = e.clientY;
            var laeuft = false;
            var ziel = null;
            var unten = false;
            try {
              griff.setPointerCapture(e.pointerId);
            } catch (err) {}

            function markenWeg() {
              [].slice.call(list.querySelectorAll(".drop-before, .drop-after"))
                .forEach(function (el) {
                  el.classList.remove("drop-before", "drop-after");
                });
            }

            /* Ziel aus der Geometrie bestimmen statt per Treffertest: so klappt
               es auch, wenn der Finger über einem Knopf einer anderen Zeile liegt. */
            function zielFuer(y) {
              var eintraege = [].slice.call(list.querySelectorAll(".jump"));
              var naechster = null;
              var abstand = Infinity;
              for (var i = 0; i < eintraege.length; i++) {
                var b = eintraege[i];
                if (b === jump) continue;
                var r = b.getBoundingClientRect();
                if (!r.height) continue;
                if (y >= r.top && y <= r.bottom) {
                  return { el: b, unten: y - r.top > r.height / 2 };
                }
                var d = y < r.top ? r.top - y : y - r.bottom;
                if (d < abstand) {
                  abstand = d;
                  naechster = { el: b, unten: y > r.bottom };
                }
              }
              return abstand < 40 ? naechster : null;
            }

            function bewegen(ev) {
              if (!laeuft && Math.abs(ev.clientY - startY) < 5) return;
              if (!laeuft) {
                laeuft = true;
                jump.classList.add("dragging");
              }
              markenWeg();
              ziel = null;
              var t = zielFuer(ev.clientY);
              if (!t) return;
              unten = t.unten;
              t.el.classList.add(unten ? "drop-after" : "drop-before");
              ziel = t.el;
            }

            function loslassen() {
              griff.removeEventListener("pointermove", bewegen);
              griff.removeEventListener("pointerup", loslassen);
              griff.removeEventListener("pointercancel", loslassen);
              jump.classList.remove("dragging");
              markenWeg();
              if (laeuft && ziel && ziel.__kopf) onMove(h, ziel.__kopf, unten);
            }

            griff.addEventListener("pointermove", bewegen);
            griff.addEventListener("pointerup", loslassen);
            griff.addEventListener("pointercancel", loslassen);
          });
        }
        jump.__kopf = h;

        /* Unterpunkte hängen unter dem Hauptpunkt darüber */
        if (h.tagName === "H4" && offeneGruppe) {
          var subLi = document.createElement("li");
          subLi.className = "sub";
          if (werkzeuge) {
            var subRow = document.createElement("div");
            subRow.className = "row";
            subRow.appendChild(jump);
            subRow.appendChild(werkzeuge);
            subLi.appendChild(subRow);
          } else {
            subLi.appendChild(jump);
          }
          offeneGruppe.subs.appendChild(subLi);
          return;
        }

        var li = document.createElement("li");
        li.className = "grp" + (h.tagName === "H4" ? " sub" : "");
        var row = document.createElement("div");
        row.className = "row";
        var tog = document.createElement("button");
        tog.type = "button";
        tog.className = "sub-toggle empty";
        tog.textContent = "▼";
        tog.title = "Unterpunkte ein- und ausklappen";
        tog.setAttribute("aria-label", "Unterpunkte ein- und ausklappen");
        var subs = document.createElement("ol");
        subs.className = "toc-subs";
        row.appendChild(tog);
        row.appendChild(jump);
        if (werkzeuge) row.appendChild(werkzeuge);
        li.appendChild(row);
        li.appendChild(subs);
        list.appendChild(li);

        var key = list.children.length - 1;
        tog.addEventListener("click", function () {
          var zu = !li.classList.contains("closed");
          li.classList.toggle("closed", zu);
          tog.setAttribute("aria-expanded", zu ? "false" : "true");
          zugeklappt[key] = zu;
          slide(subs, !zu);
        });

        offeneGruppe = { subs: subs, li: li, tog: tog, key: key };
      });

      /* Umschalter nur dort zeigen, wo es wirklich Unterpunkte gibt */
      [].slice.call(list.children).forEach(function (li, i) {
        var subs = li.querySelector("ol");
        var tog = li.querySelector(".sub-toggle");
        if (!subs || !subs.children.length) return;
        tog.classList.remove("empty");
        /* Wer hier noch nichts umgeschaltet hat, bekommt den Punkt zu:
           beim Öffnen zeigt die Gliederung nur die Hauptpunkte. */
        var zu = zugeklappt[i] === undefined ? true : zugeklappt[i];
        tog.setAttribute("aria-expanded", zu ? "false" : "true");
        if (zu) {
          li.classList.add("closed");
          subs.style.height = "0px";
        }
      });

      if (warFokus && markiert) {
        var wieder = [].slice.call(list.querySelectorAll(".jump")).filter(function (b) {
          return b.__kopf === markiert;
        })[0];
        if (wieder) {
          try {
            wieder.focus({ preventScroll: true });
          } catch (e) {
            wieder.focus();
          }
        }
      }
      return heads.length;
    }

    sync();
    box.appendChild(head);
    box.appendChild(list);
    return { box: box, refresh: refresh };
  }

  function startEditing() {
    draft = null;
    editing = true;
    render();
  }

  /* ---------- editor ---------- */

  var ALLOWED = {
    H3: 1, H4: 1, H5: 1, P: 1, UL: 1, OL: 1, LI: 1,
    STRONG: 1, B: 1, EM: 1, I: 1, U: 1, BR: 1, HR: 1,
    TABLE: 1, THEAD: 1, TBODY: 1, TR: 1, TH: 1, TD: 1, CODE: 1,
    /* trägt die Einrückung — wurde vorher beim Sichern zu einem Absatz
       plattgemacht, deshalb war jede Einrückung nach dem Speichern weg */
    BLOCKQUOTE: 1
  };
  var RENAME = { DIV: "p", H1: "h3", H2: "h3", H6: "h5" };

  function sanitize(html) {
    var box = document.createElement("div");
    box.innerHTML = html;
    var els = [].slice.call(box.querySelectorAll("*"));
    els.forEach(function (el) {
      if (!el.parentNode) return;
      var tag = el.tagName;
      if (tag === "SCRIPT" || tag === "STYLE" || tag === "IFRAME" || tag === "OBJECT") {
        el.remove();
        return;
      }
      if (RENAME[tag]) {
        var n = document.createElement(RENAME[tag]);
        while (el.firstChild) n.appendChild(el.firstChild);
        el.parentNode.replaceChild(n, el);
        return;
      }
      if (!ALLOWED[tag]) {
        var p = el.parentNode;
        while (el.firstChild) p.insertBefore(el.firstChild, el);
        el.remove();
        return;
      }
      [].slice.call(el.attributes).forEach(function (a) {
        el.removeAttribute(a.name);
      });
    });
    /* execCommand sometimes wraps lists or tables in a paragraph — unwrap those */
    [].slice.call(box.querySelectorAll("p")).forEach(function (p) {
      if (!p.parentNode || !p.querySelector("ul, ol, table, hr, h3, h4, h5")) return;
      var par = p.parentNode;
      while (p.firstChild) par.insertBefore(p.firstChild, p);
      p.remove();
    });
    /* auch beim Sichern: freistehender Text wird zu Absätzen */
    absaetzeInContainer(box);
    /* Ein leerer Absatz ist eine bewusst gesetzte Leerzeile — die bleibt
       stehen, sonst verschwindet jeder von Hand gemachte Abstand beim
       Sichern wieder. */
    return box.innerHTML.trim();
  }

  /* Text, der frei zwischen Blöcken hängt, in Absätze fassen */
  function absaetzeInContainer(root) {
    var blockTag = /^(P|H3|H4|H5|UL|OL|TABLE|HR)$/;
    var lauf = [];
    function abschliessen() {
      if (!lauf.length) return;
      var nurLeer = lauf.every(function (k) {
        return k.nodeType === 3 ? !k.nodeValue.trim() : false;
      });
      if (nurLeer) {
        lauf.forEach(function (k) {
          if (k.parentNode) k.remove();
        });
      } else {
        var abs = document.createElement("p");
        root.insertBefore(abs, lauf[0]);
        lauf.forEach(function (k) {
          abs.appendChild(k);
        });
      }
      lauf = [];
    }
    [].slice.call(root.childNodes).forEach(function (k) {
      if (k.nodeType === 1 && blockTag.test(k.tagName)) {
        abschliessen();
        return;
      }
      if (k.nodeType === 1 && k.tagName === "BR") {
        abschliessen();
        k.remove();
        return;
      }
      lauf.push(k);
    });
    abschliessen();
  }

  function isEmptyHtml(html) {
    if (!html) return true;
    var box = document.createElement("div");
    box.innerHTML = html;
    return !box.textContent.trim() && !box.querySelector("hr, table, img");
  }

  /* wrap loose tables so wide ones scroll instead of stretching the page */
  function displayHtml(html) {
    var box = document.createElement("div");
    box.innerHTML = html;
    [].slice.call(box.querySelectorAll("table")).forEach(function (t) {
      if (t.parentNode && t.parentNode.classList.contains("table-wrap")) return;
      var w = document.createElement("div");
      w.className = "table-wrap";
      t.parentNode.replaceChild(w, t);
      w.appendChild(t);
    });
    return box.innerHTML;
  }

  function cmd(name, value) {
    try {
      if (value === undefined) document.execCommand(name, false);
      else document.execCommand(name, false, value);
    } catch (e) {}
  }

  function selectionIn(el, tagRe) {
    var s = window.getSelection();
    if (!s || !s.rangeCount) return null;
    var n = s.getRangeAt(0).startContainer;
    while (n && n !== el) {
      if (n.nodeType === 1 && tagRe.test(n.tagName)) return n;
      n = n.parentNode;
    }
    return null;
  }

  function buildEditor(topic) {
    var ed = document.createElement("div");
    ed.className = "editor";

    var bar = document.createElement("div");
    bar.className = "fmtbar";

    var box = document.createElement("div");
    box.className = "doc editable";
    box.contentEditable = "true";
    box.spellcheck = true;
    box.setAttribute("role", "textbox");
    box.setAttribute("aria-multiline", "true");
    box.setAttribute("aria-label", "Inhalt von " + topic.title);
    /* Jede Änderung im Text wird als Schritt in den gemeinsamen Verlauf gelegt —
       auch die, die der Browser selbst nicht kennt (Tabellenzeilen etwa). */
    var textKey = topic.id || "__home";
    /* Ein Tabulatorschritt — vier geschützte Leerzeichen, damit er beim
       Sichern erhalten bleibt und überall gleich breit ist. */
    var TABULATOR = "\u00a0\u00a0\u00a0\u00a0";
    var toc = null;
    var histPrev = "";
    var histTime = 0;
    var histKind = "";
    var inRun = false;

    box.innerHTML = draft !== null ? draft : topic.html || "<p><br></p>";
    histPrev = box.innerHTML;

    cmd("styleWithCSS", "false");
    cmd("defaultParagraphSeparator", "p");

    var savedRange = null;

    function selInBox() {
      var s = window.getSelection();
      if (!s || !s.rangeCount) return false;
      return box.contains(s.getRangeAt(0).commonAncestorContainer);
    }

    function remember() {
      if (selInBox()) savedRange = window.getSelection().getRangeAt(0).cloneRange();
    }

    /* toolbar clicks must not move the caret — put it back where the user left it.
       Read the selection BEFORE focusing: focusing collapses it to the start. */
    function restore() {
      remember();
      if (document.activeElement !== box) {
        try {
          box.focus({ preventScroll: true });
        } catch (e) {
          box.focus();
        }
      }
      var s = window.getSelection();
      if (!savedRange) {
        savedRange = document.createRange();
        savedRange.selectNodeContents(box);
        savedRange.collapse(false);
      }
      s.removeAllRanges();
      s.addRange(savedRange);
    }

    function changed(kind) {
      if (inRun && kind !== "cmd") return;
      draft = box.innerHTML;
      if (sanitize(draft) !== (topic.html || "")) markDirty();
      histRecord(kind === "cmd" ? "cmd" : "type");
      if (toc) toc.refresh();
      syncTools();
    }

    /* Tippen wird zu einem Schritt zusammengefasst, solange es zügig weitergeht;
       jeder Befehl ist ein eigener Schritt. */
    function histRecord(kind) {
      var now = Date.now();
      var join = kind === "type" && histKind === "type" && now - histTime < 700;
      if (!join && histPrev !== box.innerHTML) {
        pushUndo({ kind: "text", key: textKey, html: histPrev });
      }
      histPrev = box.innerHTML;
      histTime = now;
      histKind = kind;
    }

    /* Block commands replace the caret's text node, so a node reference is useless.
       Measure the caret as a character offset into the whole text instead. */
    /* Anfang UND Ende der Auswahl merken, nicht nur den Cursor — sonst ist
       nach "Fett" die Markierung weg und man kann nicht gleich noch
       "Aufzählung" draufsetzen. */
    /* Die Position wird je Block gemerkt (welcher Block, wie viele Zeichen
       darin). Eine reine Gesamtzahl wäre am Blockanfang nicht von "Ende des
       Blocks davor" zu unterscheiden — genau daher kam das Springen nach oben. */
    /* Als Block zählt die kleinste Einheit, in der Text steht — ein Absatz,
       eine Überschrift, ein einzelner Aufzählungspunkt, eine Tabellenzelle.
       Die ganze Liste als Einheit zu nehmen wäre zu grob: der Cursor landete
       sonst am Ende des ersten Punktes statt am Anfang des zweiten. */
    var BLOCKWAHL = "p, h3, h4, h5, li, td, th";

    function blattBloecke() {
      return [].slice.call(box.querySelectorAll(BLOCKWAHL));
    }

    function stelleMerken(container, offset) {
      var el = container && container.nodeType === 1 ? container : container && container.parentElement;
      var blk = el && el.closest ? el.closest(BLOCKWAHL) : null;
      if (!blk || !box.contains(blk)) return null;
      try {
        var r = document.createRange();
        r.selectNodeContents(blk);
        r.setEnd(container, offset);
        return { block: blattBloecke().indexOf(blk), off: r.toString().length };
      } catch (e) {
        return null;
      }
    }

    function selOffsets() {
      var s = window.getSelection();
      if (!s || !s.rangeCount || !box.contains(s.anchorNode)) return null;
      var live = s.getRangeAt(0);
      var a = stelleMerken(live.startContainer, live.startOffset);
      var b = stelleMerken(live.endContainer, live.endOffset);
      if (!a || !b) return null;
      return { start: a, end: b };
    }

    function stelleZu(pos) {
      if (!pos || pos.block < 0) return null;
      var blk = blattBloecke()[pos.block];
      if (!blk) return null;
      var walker = document.createTreeWalker(blk, NodeFilter.SHOW_TEXT, null);
      var n;
      var acc = 0;
      while ((n = walker.nextNode())) {
        var len = n.nodeValue.length;
        if (acc + len >= pos.off) return { node: n, offset: pos.off - acc };
        acc += len;
      }
      /* Block ohne Text, etwa eine leere Zeile */
      return { node: blk, offset: 0 };
    }

    function setSel(o) {
      if (!o) return;
      var s = window.getSelection();
      var a = stelleZu(o.start);

        for (var j = i + richtung; j >= 0 && j < hs.length; j += richtung) {

        box.focus();
      }
      var r = document.createRange();
      r.selectNodeContents(box);
      r.collapse(true);
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      document.querySelector(".main").scrollTop = 0;
      syncTools();
    }, 0);

    return ed;
  }

  function render() {
    activeSync = null;
    activeText = null;
    document.title = state.home.title || "Themengebiete";
    renderRail();
    renderMain();
    syncUndo();
  }

  function select(id) {
    setNav(false);
    if (homeEditing) commitHome(true);
    else if (editing) commitDraft();
    editing = false;
    draft = null;
    state.selected = id;
    render();
    document.querySelector(".main").scrollTop = 0;
  }

  function commitDraft() {
    if (draft !== null) {
      var clean = sanitize(draft);
      if (homeEditing) {
        if (clean !== state.home.intro) {
          state.home.intro = clean;
          markDirty();
        }
      } else {
        var cur = current();
        if (cur && clean !== cur.topic.html) {
          cur.topic.html = clean;
          markDirty();
        }
      }
    }
    draft = null;
  }

  /* ---------- mutations ---------- */

  function addGroup() {
    modal({
      title: "Neues Überthema",
      fields: [{ key: "name", label: "Name", value: "", placeholder: "z. B. Sprache", required: true }],
      confirm: "Anlegen",
      onOk: function (v) {
        snapshot();
        state.groups.push({ id: uid("g"), name: v.name, topics: [] });
        markDirty();
        render();
      }
    });
  }

  function renameGroup(g) {
    modal({
      title: "Überthema umbenennen",
      text: "Name leer lassen und speichern löscht das Überthema.",
      fields: [{ key: "name", label: "Name", value: g.name }],
      onOk: function (v) {
        /* leer heißt löschen — nichts bleibt kommentarlos stehen */
        if (!v.name) {
          deleteGroup(g);
          return;
        }
        snapshot();
        g.name = v.name;
        markDirty();
        render();
      }
    });
  }


  function moveGroup(i, d) {
    var j = i + d;
    if (j < 0 || j >= state.groups.length) return;
    snapshot();
    var tmp = state.groups[i];
    state.groups[i] = state.groups[j];
    state.groups[j] = tmp;
    markDirty();
    render();
  }

  function addTopic(g) {
    modal({
      title: "Neues Thema",
      text: "In „" + g.name + "“",
      fields: [
        { key: "num", label: "Nr.", value: String(g.topics.length + 1) },
        { key: "title", label: "Titel", value: "", placeholder: "z. B. Recht", required: true }
      ],
      confirm: "Anlegen",
      onOk: function (v) {
        snapshot();
        var t = { id: uid("t"), num: v.num, title: v.title, html: "" };
        g.topics.push(t);
        state.selected = t.id;
        markDirty();
        render();
      }
    });
  }

  function renameTopic(t) {
    modal({
      title: "Thema umbenennen",
      fields: [
        { key: "num", label: "Nr.", value: t.num },
        { key: "title", label: "Titel", value: t.title }
      ],
      text: "Titel leer lassen und speichern löscht das Thema.",
      onOk: function (v) {
        if (!v.title) {
          var home = findGroupOf(t);
          if (home) deleteTopic(home, t);
          return;
        }
        snapshot();
        t.num = v.num;
        t.title = v.title;
        markDirty();
        render();
      }
    });
  }

  function findGroupOf(t) {
    var hit = null;
    state.groups.forEach(function (g) {
      if (g.topics.indexOf(t) >= 0) hit = g;
    });
    return hit;
  }

  function deleteGroup(g) {
    function drop() {
      snapshot();
      state.groups = state.groups.filter(function (x) {
        return x !== g;
      });
      if (state.selected && !findTopic(state.selected)) state.selected = null;
      markDirty();
      render();
    }
    if (!g.topics.length) {
      drop();
      return;
    }
    modal({
      title: "Überthema löschen?",
      text:
        "\u201E" + g.name + "\u201C wird mit " + g.topics.length +
        (g.topics.length === 1 ? " Thema" : " Themen") + " gelöscht.",
      confirm: "Löschen",
      danger: true,
      onOk: drop
    });
  }

  function deleteTopic(g, t) {
    modal({
      title: "Thema löschen?",
      text: "„" + t.title + "“ wird mit allen Inhalten gelöscht.",
      confirm: "Löschen",
      danger: true,
      onOk: function () {
        snapshot();
        g.topics = g.topics.filter(function (x) {
          return x !== t;
        });
        state.selected = null;
        markDirty();
        render();
      }
    });
  }

  /* Die Nummer ist die Position — nach jedem Verschieben neu durchzählen,
     über alle Überthemen hinweg. */
  function renumber() {
    var n = 0;
    state.groups.forEach(function (g) {
      g.topics.forEach(function (t) {
        n++;
        t.num = String(n);
      });
    });
  }

  function moveTopic(g, i, d) {
    var j = i + d;
    if (j < 0 || j >= g.topics.length) return;
    snapshot();
    var tmp = g.topics[i];
    g.topics[i] = g.topics[j];
    g.topics[j] = tmp;
    renumber();
    markDirty();
    render();
  }

  /* Ziehen in der Seitenleiste: Thema an eine neue Stelle setzen */
  var dragId = null;

  function dropTopic(id, toGroup, index) {
    var hit = findTopic(id);
    if (!hit) return;
    var from = hit.group;
    var t = hit.topic;
    var alt = from.topics.indexOf(t);
    if (from === toGroup) {
      if (index > alt) index--;
      if (index === alt) return;
    }
    snapshot();
    from.topics.splice(alt, 1);
    toGroup.topics.splice(index, 0, t);
    renumber();
    markDirty();
    render();
  }

  function clearDropMarks() {
    [].slice.call(railEl.querySelectorAll(".drop-before, .drop-after, .drop-end"))
      .forEach(function (el) {
        el.classList.remove("drop-before", "drop-after", "drop-end");
      });
  }

  function moveTopicToGroup(from, t, toId) {
    var to = state.groups.filter(function (g) {
      return g.id === toId;
    })[0];
    if (!to || to === from) return;
    snapshot();
    from.topics = from.topics.filter(function (x) {
      return x !== t;
    });
    to.topics.push(t);
    renumber();
    markDirty();
    render();
  }

  /* ---------- Speichern über den eigenen Server ---------- */

  /* Sichtbarer Baustand — damit man sofort sieht, ob der Browser noch eine
     alte Fassung im Zwischenspeicher hat. Steht im Verbindungs-Dialog. */
  var BAUSTAND = "03.09.2026 14:16";

  var CFG_KEY = "tg-server";
  var cfg = null;
  try {
    cfg = JSON.parse(localStorage.getItem(CFG_KEY) || "null");
  } catch (e) {}

  function cfgOk(c) {
    return !!(c && typeof c.url === "string" && /^https?:\/\//i.test(c.url) && c.token);
  }

  /* Leerzeichen und Groß-/Kleinschreibung beim Eintippen am Handy abfangen */
  function saubereAdresse(v) {
    var u = String(v || "").replace(/\s+/g, "").replace(/\/+$/, "");
    if (/^https?:\/\//i.test(u)) return u.replace(/^https?:/i, function (m) {
      return m.toLowerCase();
    });
    if (u) return "https://" + u;
    return u;
  }

  function serverFetch(method, body) {
    return fetch(cfg.url.replace(/\/+$/, "") + "/data", {
      method: method,
      headers: {
        "Authorization": "Bearer " + cfg.token,
        "Content-Type": "application/json"
      },
      body: body
    }).then(function (r) {
      if (r.status === 401) throw new Error("passwort");
      if (!r.ok) throw new Error("http " + r.status);
      return r;
    });
  }

  function askServer(erstmalig) {
    modal({
      title: erstmalig ? "Mit deinem Speicher verbinden" : "Verbindung ändern",
      text: "Adresse deines Speichers und das Passwort, das du dort gesetzt hast.  ·  Fassung " + BAUSTAND,
      fields: [
        { key: "url", label: "Adresse", value: (cfg && cfg.url) || "",
          placeholder: "https://…workers.dev", mode: "url", required: true },
        { key: "token", label: "Passwort", value: (cfg && cfg.token) || "", required: true }
      ],
      stack: true,
      confirm: "Verbinden",
      onOk: function (v) {
        cfg = { url: saubereAdresse(v.url), token: v.token };
        try {
          localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
        } catch (e) {}
        laden();
      }
    });
  }

  /* Was gerade offen ist, ist Ansichtssache dieses Geräts und kein Inhalt —
     also nicht mitsichern, sonst öffnet das nächste Gerät wieder dieses Thema. */
  function standJson() {
    var offen = state.selected;
    state.selected = null;
    var txt = JSON.stringify(state);
    state.selected = offen;
    return txt;
  }

  function save() {
    if (homeEditing) {
      commitHome(true);
    } else if (editing) {
      commitDraft();
      editing = false;
    }
    draft = null;
    homeDraft = null;
    render();
    if (readOnly || !cfgOk(cfg)) {
      toast("Keine Verbindung zum Speicher. Tippe oben auf den Stand, um sie einzurichten.");
      return;
    }
    saveBtn.disabled = true;
    statusText.textContent = "Wird gesichert …";
    var stand = standJson();
    try {
      /* Bis der Server bestätigt hat, liegt der Stand lokal —
         sonst wäre er bei einem Verbindungsabbruch weg. */
      localStorage.setItem("tg-pending", stand);
    } catch (e) {}
    serverFetch("PUT", stand).then(
      function () {
        dirty = false;
        statusEl.classList.remove("dirty");
        statusText.textContent = "Gesichert";
        try {
          localStorage.removeItem("tg-pending");
        } catch (e) {}
      },
      function (err) {
        saveBtn.disabled = false;
        statusEl.classList.add("dirty");
        if (String(err && err.message) === "passwort") {
          statusText.textContent = "Passwort falsch";
          toast("Das Passwort stimmt nicht. Tippe oben auf den Stand, um es zu ändern.");
        } else {
          statusText.textContent = "Nicht gesichert";
          toast("Sichern hat nicht geklappt — deine Änderung liegt sicher auf diesem Gerät. Versuch es gleich nochmal.");
        }
      }
    );
  }

  saveBtn.addEventListener("click", save);
  undoBtn.addEventListener("click", undo);
  document.getElementById("accent-btn").addEventListener("click", pickAccent);

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && appEl.classList.contains("nav-open")) setNav(false);
    var mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === "s") {
      e.preventDefault();
      if (!saveBtn.disabled) save();
    }
    if (mod && e.key.toLowerCase() === "z") {
      e.preventDefault();
      if (e.shiftKey) redo();
      else undo();
    }
  });

  window.addEventListener("beforeunload", function (e) {
    if (dirty) {
      e.preventDefault();
      e.returnValue = "";
    }
  });

  function normalise() {
    if (!state.groups) state.groups = [];
    /* Die App startet immer bei der Übersicht — ein gespeichertes
       "zuletzt offen" aus einem älteren Stand wird dabei verworfen. */
    state.selected = null;
    if (!state.home || typeof state.home !== "object") state.home = {};
    if (typeof state.home.eyebrow !== "string") state.home.eyebrow = "Wissenssammlung";
    if (typeof state.home.title !== "string") state.home.title = "Themengebiete";
    if (typeof state.home.intro !== "string") state.home.intro = "";
    state.groups.forEach(function (g) {
      if (!g.topics) g.topics = [];
      g.topics.forEach(function (t) {
        if (typeof t.html !== "string") t.html = "";
        delete t.body;
      });
    });
  }

  normalise();
  applyAccent();
  render();

  /* Der Verbindungsstand oben ist zugleich der Knopf dafür */
  statusEl.setAttribute("role", "button");
  statusEl.setAttribute("tabindex", "0");
  statusEl.title = "Verbindung zum Speicher";
  statusEl.style.cursor = "pointer";
  statusEl.addEventListener("click", function () {
    askServer(!cfgOk(cfg));
  });
  statusEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      askServer(!cfgOk(cfg));
    }
  });

  /* Ein noch nicht gesicherter Stand von diesem Gerät hat Vorrang vor dem,
     was der Server liefert — sonst wäre er nach einem Abbruch verloren. */
  function offenerStand() {
    try {
      return localStorage.getItem("tg-pending");
    } catch (e) {
      return null;
    }
  }

  function laden() {
    if (!cfgOk(cfg)) {
      goReadOnly();
      statusText.textContent = "Nicht verbunden";
      askServer(true);
      return;
    }
    readOnly = false;
    saveBtn.disabled = true;
    statusText.textContent = "Lade …";
    serverFetch("GET")
      .then(function (r) {
        return r.text();
      })
      .then(function (txt) {
        if (txt && txt.trim()) {
          var p = JSON.parse(txt);
          if (p && p.groups) state = p;
        }
        normalise();
        var offen = offenerStand();
        var zurueck = false;
        var offenState = null;
        if (offen) {
          try {
            var q = JSON.parse(offen);
            if (q && q.groups) offenState = q;
          } catch (e) {}
        }
        if (offenState) {
          /* selbe Bereinigung wie beim Sichern, sonst gälte allein die
             zuletzt offene Seite schon als ungesicherte Änderung */
          offenState.selected = null;
          if (JSON.stringify(offenState) !== JSON.stringify(state)) {
            state = offenState;
            normalise();
            zurueck = true;
          }
        }
        if (!zurueck) {
          try {
            localStorage.removeItem("tg-pending");
          } catch (e) {}
        }
        history.length = 0;
        redoStack.length = 0;
        dirty = false;
        statusEl.classList.remove("dirty");
        applyAccent();
        render();
        if (zurueck) {
          markDirty();
          toast("Eine Änderung von diesem Gerät war noch nicht gesichert — sie ist wieder da. Bitte nochmal sichern.");
        } else {
          statusText.textContent = "Gesichert";
        }
      })
      .catch(function (err) {
        goReadOnly();
        /* neu zeichnen, sonst steht dort weiter "noch keine Themen angelegt",
           obwohl in Wahrheit nur die Verbindung fehlt */
        render();
        if (String(err && err.message) === "passwort") {
          statusText.textContent = "Passwort falsch";
          toast("Das Passwort stimmt nicht. Tippe oben auf den Stand, um es zu ändern.");
        } else {
          statusText.textContent = "Kein Zugriff";
          toast("Der Speicher ist nicht erreichbar. Tippe oben auf den Stand, um die Verbindung zu prüfen.");
        }
      });
  }

  laden();

  if ("serviceWorker" in navigator) {
    /* updateViaCache:"none" — sonst holt der Browser auch diese Datei aus
       seinem 10-Minuten-Zwischenspeicher und merkt Änderungen zu spät. */
    var hatteController = !!navigator.serviceWorker.controller;
    var schonNeu = false;
    /* Doppelte Sicherung gegen eine Neulade-Schleife: höchstens einmal je Sitzung */
    try {
      if (sessionStorage.getItem("tg-neugeladen")) schonNeu = true;
    } catch (e) {}
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      /* Neue Fassung hat übernommen: einmal frisch laden, damit sie auch greift */
      if (!hatteController || schonNeu) return;
      schonNeu = true;
      try {
        sessionStorage.setItem("tg-neugeladen", "1");
      } catch (e) {}
      location.reload();
    });
    try {
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
        .catch(function () {});
    } catch (e) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  }
})();
</script>

</body>
